name: Shared checks

on:
  workflow_call:
    inputs:
      runner:
        description: JSON runner target selected by the caller
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
